[build]
  command = "npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[[edge_functions]]
  path = "/r/*"
  function = "recipe-og"

[[redirects]]
  from = "/app"
  to = "https://play.google.com/store/apps/details?id=com.calicosquid.savorrecipes"
  status = 301
  force = true

[[redirects]]
  from = "/forage/privacy"
  to = "/caper/privacy"
  status = 301

[[redirects]]
  from = "/forage/delete-account"
  to = "/caper/delete-account"
  status = 301

[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200